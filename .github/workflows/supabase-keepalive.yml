# Free Supabase projects pause after a week without activity (R11, NFR-20).
# This pings the REST API every 3 days. Set the repository secrets
# SUPABASE_URL and SUPABASE_ANON_KEY (the anon key is public by design;
# NEVER add the service_role key). Without them the job does nothing.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not set; skipping."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/decks?select=id&limit=1")
          echo "HTTP $status"
          # 200 (RLS returns an empty list to anon) means the project is awake.
          [ "$status" = "200" ]
